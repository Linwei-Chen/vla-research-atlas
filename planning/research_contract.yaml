question: "机器人视觉—语言—动作（VLA）模型在部署期如何利用新观测、示范、纠正或奖励实现在线适应与持续学习，其主要技术路线、证据强度、代价和遗忘风险是什么？"
objects: "以视觉和语言为条件、输出机器人动作或动作块的实体机器人策略；以非 VLA 在线机器人学习作为机制桥接证据时必须显式标注迁移距离"
tasks: "实体机器人操控为主，兼顾移动与长时程任务；关注新任务、新物体、新环境和部署分布变化"
contexts: "部署期或部署后迭代，包括单次任务内适应、跨回合在线更新和跨任务持续积累；实验室实体机器人证据优先"
mechanism_scope: "上下文/记忆适应、参数高效微调、交互纠错学习、奖励或偏好驱动强化微调、回放/模块化持续学习，以及专门的部署评测与安全边界"
outcomes: "成功率与泛化、在线样本效率、干预/反馈成本、计算与延迟、灾难性遗忘、安全性和可复现性"
time_window: "奠基工作至 2026-08-09"
languages: ["英文", "中文"]
source_families: ["正式会议与期刊", "官方报告与标准", "作者项目与代码"]
publication_statuses: ["同行评议", "预印本", "官方报告"]
must_cover_axes: ["主要路线", "第二分类轴", "时间线", "评测", "反证与安全"]
exclusions:
  - "仅做离线预训练或零样本泛化、没有部署期适应机制的 VLA（仅可作背景或对照）"
  - "纯语言智能体、游戏或仅仿真具身智能，除非提供不可替代的方法桥接且明确降级"
  - "仅感知模型的测试时适应，不输出机器人动作"
  - "营销页面、二手综述或无法定位一手入口的成果"
  - "将参数高效微调、测试时适应、在线学习和持续学习视为同义词的工作"
cutoff_date: "2026-08-09"
target_level: "L1"
current_level: "L1"
